[package]
name = "ferrite-terrarium"
version = "0.1.0"
description = "A Ferrite terrarium: a slow text-mode garden that grows over real days while you are away."
authors = ["Ryan Wetzstein"]
license = "Apache-2.0"
repository = "https://github.com/rwetz/ferrite-terrarium"
readme = "README.md"
keywords = ["gpui", "ferrite", "terrarium", "ascii", "desktop"]
categories = ["gui", "games"]
edition = "2024"
rust-version = "1.88"

[dependencies]
ferrite-design = { git = "https://github.com/rwetz/ferrite-design", rev = "8129fdb50032cc6ec91c1c4ae9a86059870e3b26" }
# Must match ferrite-design exactly (PITFALLS §1).
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

# gpui is sluggish unoptimised; optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.31"
